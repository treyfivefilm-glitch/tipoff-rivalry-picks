name: Verify multisport feeds
on:
  push:
    branches: [feature/complete-product-roadmap-2026-10-27]
    paths: [.github/workflows/multisport-feed-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check read-only schedule and scoreboard APIs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://api-web.nhle.com/v1/score/2026-10-26' \
            'https://api-web.nhle.com/v1/schedule/2026-10-26' \
            'https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2026-10-26' \
            'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261025' \
            'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20261026'
          do
            code=$(curl -L -s --connect-timeout 5 --max-time 15 -o /tmp/score.json -w '%{http_code}' "$url" || true)
            echo "Source: $url HTTP: $code bytes: $(wc -c </tmp/score.json)"
            if [[ "$code" == 200 ]]; then
              python3 -c 'import json; j=json.load(open("/tmp/score.json")); print("keys:",list(j.keys())[:8]); print("games:",len(j.get("games",[])),"events:",len(j.get("events",[])),"dates:",len(j.get("dates",[])))' || true
            fi
          done
